# Meson cross file for a CactOS kernel module (x86_64, ring 0).
#
#   meson setup build-meson --cross-file cross/x86_64-cact-clang.ini
#
# The module is a freestanding ET_REL object compiled against the kernel tree's
# headers and mapped by the kernel's module loader, so clang only needs 64-bit
# mode; system = 'none' keeps Meson from assuming a hosted C library.

[binaries]
c = 'clang'
ar = 'ar'
strip = 'strip'
objcopy = 'objcopy'

[built-in options]
c_args = ['-m64']

[host_machine]
system = 'none'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
